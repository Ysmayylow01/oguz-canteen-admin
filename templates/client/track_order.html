{% extends "base.html" %}

{% block title %}Sargyt Yzarla{% endblock %}

{% block content %}

<div class="navbar glass fade-in">
    <h2>📦 Sargyt Yzarla</h2>
    <div>
        <a href="/">Menýu</a>
        <a href="/track-order">Yzarla</a>
    </div>
</div>

<div class="container fade-in">

    <!-- SEARCH -->
    <div class="card glass search-box">
        <h3>🔎 Sargyt belgisi</h3>

        <div class="search-row">
            <input type="number" id="order-id" placeholder="ID giriziň...">
            <button onclick="trackOrder()">Gözle</button>
        </div>
    </div>

    <!-- RESULT -->
    <div id="order-details"></div>

</div>

<style>

/* SEARCH */
.search-box {
    text-align: center;
}

.search-row {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.search-row input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: rgba(255,255,255,0.08);
    color: white;
}

.search-row button {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background: #3D9AF0;
    color: white;
    cursor: pointer;
}

/* STATUS BAR */
.status-bar {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
}

.step {
    flex: 1;
    text-align: center;
    position: relative;
}

.step::before {
    content: '';
    position: absolute;
    top: 15px;
    left: -50%;
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.1);
}

.step:first-child::before {
    display: none;
}

.step.active {
    color: #3D9AF0;
}

/* ORDER CARD */
.order-card {
    margin-top: 20px;
}

.order-card h3 {
    margin-bottom: 10px;
}

/* TABLE */
table {
    margin-top: 10px;
}

</style>

<script>

function trackOrder() {
    const orderId = document.getElementById('order-id').value;

    if (!orderId) {
        showToast("ID giriziň");
        return;
    }

    fetch('/api/orders/' + orderId)
    .then(res => res.json())
    .then(data => {

        if (!data.success) {
            document.getElementById('order-details').innerHTML =
                `<div class="card glass">❌ Sargyt tapylmady</div>`;
            return;
        }

        const o = data.order;

        const steps = ["pending","preparing","ready","completed"];

        let statusHtml = '<div class="status-bar">';
        steps.forEach(s => {
            let active = steps.indexOf(s) <= steps.indexOf(o.status);
            statusHtml += `<div class="step ${active ? 'active':''}">${s}</div>`;
        });
        statusHtml += '</div>';

        let items = '';
        o.items.forEach(i=>{
            items += `<tr>
                <td>${i.food_item.name}</td>
                <td>${i.quantity}</td>
                <td>${i.price.toFixed(0)} manat</td>
            </tr>`;
        });

        document.getElementById('order-details').innerHTML = `
            <div class="card glass order-card">
                <h3>📦 Sargyt #${o.id}</h3>

                ${statusHtml}

                <p><strong>👤 ${o.customer_name}</strong></p>
                <p>📞 ${o.customer_phone}</p>
                <p>💰 ${o.total_amount.toFixed(0)} manat</p>

                <h4>🍴 Önümler:</h4>

                <table>
                    <thead>
                        <tr>
                            <th>Ady</th>
                            <th>Sany</th>
                            <th>Baha</th>
                        </tr>
                    </thead>
                    <tbody>${items}</tbody>
                </table>
            </div>
        `;
    });
}

/* TOAST */
function showToast(text){
    const t=document.createElement("div");
    t.innerText=text;
    t.style.position="fixed";
    t.style.bottom="20px";
    t.style.right="20px";
    t.style.background="#3D9AF0";
    t.style.padding="10px";
    t.style.borderRadius="8px";
    document.body.appendChild(t);
    setTimeout(()=>t.remove(),2000);
}

/* AUTO LOAD */
const id = new URLSearchParams(window.location.search).get("id");
if(id){
    document.getElementById("order-id").value=id;
    trackOrder();
}

</script>

{% endblock %}
