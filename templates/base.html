<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Oguz Canteen{% endblock %}</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

/* 🌈 BACKGROUND */
body {
    background: linear-gradient(135deg, #0f172a, #1e293b);
    min-height: 100vh;
    color: white;
}

/* 🧊 GLASS EFFECT */
.glass {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 15px;
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    margin: 20px;
}

.navbar a {
    color: #cbd5e1;
    margin-left: 20px;
    text-decoration: none;
    transition: 0.3s;
}

.navbar a:hover {
    color: #3D9AF0;
}

/* CONTAINER */
.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

/* CARD */
.card {
    padding: 20px;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px) scale(1.02);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

/* STAT */
.stat {
    font-size: 2.5rem;
    font-weight: 600;
    color: #3D9AF0;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th {
    color: #94a3b8;
    font-size: 0.8rem;
    text-align: left;
    padding: 10px;
}

td {
    padding: 12px 10px;
    border-top: 1px solid rgba(255,255,255,0.1);
}

tr:hover {
    background: rgba(255,255,255,0.05);
}

/* STATUS */
.status {
    padding: 6px 12px;
    border-radius: 10px;
    font-size: 0.75rem;
}

.pending { background: rgba(255,0,0,0.2); color: #ff6b6b; }
.preparing { background: rgba(255,165,0,0.2); color: orange; }
.ready { background: rgba(0,255,150,0.2); color: #00ffa6; }
.completed { background: rgba(61,154,240,0.2); color: #3D9AF0; }

/* ✨ ANIMATION */
.fade-in {
    animation: fadeIn 0.6s ease-in-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>

</head>
<body>
    {% block content %}{% endblock %}
    
    <script src="{{ url_for('static', filename='js/cart.js') }}"></script>
    {% block scripts %}{% endblock %}

</body>
</html>
